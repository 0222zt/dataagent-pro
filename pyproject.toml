[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["static", "data", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG"]
ignore = [
    "ARG001",  # FastAPI 依赖注入会有未使用的参数
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN001", "ANN201", "ANN202"]
"app/security/sandbox.py" = ["S102"]
