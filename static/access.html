<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataAgent Pro · 访问验证</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 4v24h24' fill='none' stroke='%231e1c18' stroke-width='2'/%3E%3Crect x='8' y='18' width='4' height='10' fill='%232b5f9e'/%3E%3Crect x='15' y='12' width='4' height='16' fill='%232b5f9e'/%3E%3Crect x='22' y='7' width='4' height='21' fill='%232b5f9e'/%3E%3C/svg%3E"
  />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4f0;
      --surface: #fffefb;
      --surface-2: #f8f7f3;
      --border: rgba(30, 28, 24, 0.10);
      --border-strong: rgba(30, 28, 24, 0.22);
      --text: #1e1c18;
      --text-2: #56534c;
      --text-3: #6e6a61;
      --accent: #2b5f9e;
      --red: #b0352c;
      --tint-red: rgba(176, 53, 44, 0.06);
      --shadow: 0 8px 24px rgba(30, 28, 24, 0.08);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-ui: "IBM Plex Sans", "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #141311;
        --surface: #1b1a18;
        --surface-2: #201f1c;
        --border: rgba(236, 233, 225, 0.10);
        --border-strong: rgba(236, 233, 225, 0.22);
        --text: #ece9e1;
        --text-2: #aaa69c;
        --text-3: #8b877e;
        --accent: #8fb6e6;
        --red: #e07a72;
        --tint-red: rgba(224, 122, 114, 0.08);
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.36);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(400px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      color: var(--text);
    }
    .mark svg { width: 16px; height: 16px; }
    h1 { margin: 20px 0 8px; font-size: 20px; font-weight: 500; letter-spacing: 0; }
    p { margin: 0; color: var(--text-2); font-size: 13px; line-height: 1.7; }
    form { margin-top: 24px; display: grid; gap: 12px; }
    label { font-size: 12px; color: var(--text-3); }
    input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease);
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(43, 95, 158, 0.24); }
    button {
      height: 40px;
      margin-top: 4px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--text);
      color: var(--surface);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 140ms var(--ease), transform 140ms var(--ease);
    }
    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: progress; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .error {
      display: none;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--red);
      background: var(--tint-red);
    }
    .error.show { display: block; }
    .foot { margin-top: 24px; font-size: 12px; color: var(--text-3); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
    </div>
    <h1>DataAgent Pro</h1>
    <p>这是一个带访问码的在线演示。输入分享者给你的访问码即可进入图表工作台。</p>

    <form id="form" autocomplete="off">
      <label for="code">访问码</label>
      <input id="code" name="code" type="password" inputmode="text" placeholder="请输入访问码" required autofocus />
      <div class="error" id="error" role="alert"></div>
      <button id="submit" type="submit">进入演示</button>
    </form>

    <p class="foot">访问码只用于限制链接传播，不会上传到任何第三方。验证通过后 7 天内免输。</p>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('code');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const code = input.value.trim();
      if (!code) return;
      error.classList.remove('show');
      submit.disabled = true;
      submit.textContent = '验证中…';
      try {
        const response = await fetch('/api/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || '访问码不正确');
        window.location.replace('/');
      } catch (err) {
        error.textContent = err.message || '访问码不正确';
        error.classList.add('show');
        input.select();
        submit.disabled = false;
        submit.textContent = '进入演示';
      }
    });
  </script>
</body>
</html>
