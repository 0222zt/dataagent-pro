<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataAgent Pro · 访问验证</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(37, 99, 235, 0.22), transparent 60%),
        radial-gradient(900px 500px at 100% 110%, rgba(16, 185, 129, 0.18), transparent 55%),
        #0b1220;
      color: #e5ecf8;
    }
    .card {
      width: min(420px, 100%);
      padding: 34px 30px 28px;
      border-radius: 22px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 24px 70px rgba(2, 6, 23, 0.55);
      backdrop-filter: blur(14px);
    }
    .mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 24px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      box-shadow: 0 10px 26px rgba(37, 99, 235, 0.35);
    }
    h1 { margin: 18px 0 6px; font-size: 21px; letter-spacing: 0.01em; }
    p  { margin: 0; color: #9fb0c9; font-size: 13.5px; line-height: 1.65; }
    form { margin-top: 22px; display: grid; gap: 12px; }
    label { font-size: 12px; font-weight: 600; color: #b9c7dc; letter-spacing: 0.04em; }
    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.32);
      background: rgba(2, 6, 23, 0.55);
      color: #f1f5f9;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22); }
    button {
      margin-top: 4px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 650;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.28);
      transition: transform 0.12s, filter 0.12s;
    }
    button:hover { filter: brightness(1.06); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: progress; }
    .error {
      display: none;
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #fecaca;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.32);
    }
    .error.show { display: block; }
    .foot { margin-top: 20px; font-size: 12px; color: #7f91ab; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">📊</div>
    <h1>DataAgent Pro</h1>
    <p>这是一个带访问码的在线演示。输入分享者给你的访问码即可进入图表工作台。</p>

    <form id="form" autocomplete="off">
      <label for="code">访问码</label>
      <input id="code" name="code" type="password" inputmode="text" placeholder="请输入访问码" required autofocus />
      <div class="error" id="error" role="alert"></div>
      <button id="submit" type="submit">进入演示</button>
    </form>

    <p class="foot">访问码只用于限制链接传播，不会上传到任何第三方。验证通过后 7 天内免输。</p>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('code');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const code = input.value.trim();
      if (!code) return;
      error.classList.remove('show');
      submit.disabled = true;
      submit.textContent = '验证中…';
      try {
        const response = await fetch('/api/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || '访问码不正确');
        window.location.replace('/');
      } catch (err) {
        error.textContent = err.message || '访问码不正确';
        error.classList.add('show');
        input.select();
        submit.disabled = false;
        submit.textContent = '进入演示';
      }
    });
  </script>
</body>
</html>
